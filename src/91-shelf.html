(()=>{'use strict';document.documentElement.classList.add('js');const cards=[...document.querySelectorAll('.part-card')],buttons=[...document.querySelectorAll('[data-filter]')],search=document.getElementById('search'),url=new URL(location.href);let role=['bay','corridor','layer'].includes(url.searchParams.get('role'))?url.searchParams.get('role'):'all';search.value=(url.searchParams.get('q')||'').slice(0,120);function filter(write){let shown=0;const q=search.value.trim().toLowerCase();for(const card of cards){card.hidden=(role!=='all'&&card.dataset.role!==role)||(q&&!card.dataset.search.includes(q));if(!card.hidden)shown++;}buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===role)));document.getElementById('result-count').textContent=shown+' / '+cards.length+' parts';document.getElementById('empty').hidden=shown!==0;if(write){const u=new URL(location.href);role==='all'?u.searchParams.delete('role'):u.searchParams.set('role',role);q?u.searchParams.set('q',search.value.trim()):u.searchParams.delete('q');history.replaceState(null,'',u);}}buttons.forEach(b=>b.addEventListener('click',()=>{role=b.dataset.filter;filter(true)}));search.addEventListener('input',()=>filter(true));filter(false)})();
