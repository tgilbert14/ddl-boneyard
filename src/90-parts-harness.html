}

<script>
(() => {
  'use strict';
  /* The workbench is a mini core: the same ticker, ctx, canvas sizing and module bytes as the ride. */
  const { Ticker, dprCap, sizeCanvas, makeCtx, coerceParam, buildTweakRow } = BONEYARD;
  const SLUG = '__SLUG__', KIND = '__KIND__', ROLE = '__ROLE__';
  const m = window.BAYS.find((x) => x.slug === SLUG);
  const html = document.documentElement, stage = document.getElementById('stage');
  const canvas = document.getElementById('part'), host = document.getElementById('dom-host');
  stage.tabIndex = 0;
  const tweaks = document.getElementById('tweaks'), live = document.getElementById('live'), stillBox = document.getElementById('still');
  const statusEl = document.getElementById('status'), configState = document.getElementById('config-state');
  const moduleActions = document.getElementById('module-actions'), interactionHint = document.getElementById('interaction-hint');
  const paramsDisclosure = document.getElementById('params-disclosure');
  const resetButton = document.getElementById('reset'), copyButton = document.getElementById('copy-link');
  const pngButton = document.getElementById('save-png'), htmlButton = document.getElementById('save-html');
  const assetNote = document.getElementById('asset-note');
  if (!m) { statusEl.dataset.tone = 'error'; statusEl.textContent = 'Part registration failed.'; return; }

  const DEFAULTS = Object.freeze(Object.assign({}, m.params));
  const RULES = {
    fftSize: { values: [32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768] },
    lanePool: { values: [4, 8, 16, 32, 64, 128, 256, 512, 1024] },
    ve: { values: [1, 2, 3] }, copies: { min: 1, max: 5, step: 1 },
    lines: { min: 8, step: 1 }, samples: { min: 16, step: 1 }, liteSamples: { min: 16, step: 1 },
    drops: { min: 100, max: 6000, step: 100 }, buffer: { min: 120, step: 1 }, maxBackingWidth: { min: 240, step: 1 },
    base: { min: 20 }, pylonEvery: { min: 1 }, zLines: { min: 4, step: 1 },
    pxPerSecond: { min: 1 }, wavelength: { min: 8 }, period: { min: 0.1 },
    rays: { min: 0, step: 1 }, rings: { min: 0, step: 1 }, dotsPerSide: { min: 2, step: 1 },
    count: { min: 1, step: 1 }, ownStars: { min: 1, step: 1 }, far: { min: 1, step: 1 }, near: { min: 1, step: 1 },
    oceanDots: { min: 100, step: 100 }, landDots: { min: 100, step: 100 }, text: { maxLength: 512 },
  };
  if (SLUG === 'gate') Object.assign(RULES, {
    cruise: { min: 0.2, max: 20, step: 0.01 }, calmCruise: { min: 0.25, max: 1, step: 0.01 },
    scrollGain: { min: 0, max: 6, step: 0.01 }, settle: { min: 0.08, max: 2, step: 0.01 },
    corridorW: { min: 1.1, max: 4, step: 0.01 }, floorH: { min: 0.6, max: 2.5, step: 0.01 },
    ceilH: { min: 0.6, max: 2.5, step: 0.01 }, focalK: { min: 0.35, max: 1.3, step: 0.01 },
    near: { min: 0.25, max: 1.2, step: 0.01 }, fog: { min: 16, max: 64, step: 1 },
    ribSpacing: { min: 1.6, max: 4.4, step: 0.01 }, ribWidth: { min: 0.08, max: 0.42, step: 0.01 },
    finReach: { min: 0.12, max: 0.42, step: 0.01 }, finSpan: { min: 0.24, max: 0.7, step: 0.01 },
    lanePool: { values: [12, 16, 32, 64] }, stripPerUnit: { min: 0.25, max: 8, step: 0.01 },
    gain: { min: 0.35, max: 2.4, step: 0.01 }, sat: { min: 0.6, max: 3.2, step: 0.01 },
    toneKnee: { min: 128, max: 238, step: 1 }, idleEnergy: { min: 0.25, max: 1.1, step: 0.01 },
    railAlpha: { min: 0.1, max: 1, step: 0.01 }, sideShade: { min: 0.35, max: 1, step: 0.01 },
    shove: { min: 0, max: 0.7, step: 0.01 }, stillDolly: { min: -4096, max: 4096, step: 0.01 },
    chargeTime: { min: 0.2, max: 3, step: 0.01 }, travelTime: { min: 0.35, max: 4, step: 0.01 },
    recoveryTime: { min: 0.3, max: 5, step: 0.01 }, burst: { min: 0.4, max: 5, step: 0.01 },
    shakePx: { min: 0, max: 8, step: 0.05 },
  });
  const HOLDS = SLUG === 'jump' || SLUG === 'scope';
  const needsAssets = !!m.dem || ['gate', 'terminator', 'yard-scene'].includes(SLUG);
  assetNote.textContent = needsAssets ? 'HTML export needs a copy of assets/ beside the file.' : 'HTML export is contained in one file.';
  if (KIND === 'dom') { pngButton.disabled = true; pngButton.title = 'PNG export is available for canvas parts.'; }

  const issues = { rejected: 0, adjusted: 0 };
  let embedded = null;
  const embeddedEl = document.getElementById('boneyard-part-config');
  if (embeddedEl) {
    try { embedded = JSON.parse(embeddedEl.textContent); if (!embedded || embedded.slug !== SLUG) { embedded = null; issues.rejected++; } }
    catch (_) { issues.rejected++; }
  }
  const params = Object.assign({}, DEFAULTS);
  function acceptParam(key, raw) {
    if (!Object.prototype.hasOwnProperty.call(DEFAULTS, key)) { issues.rejected++; return; }
    const result = coerceParam(key, raw, DEFAULTS[key], RULES[key]);
    if (!result.accepted) { issues.rejected++; return; }
    if (result.adjusted) issues.adjusted++;
    params[key] = result.value;
  }
  if (embedded && embedded.params && typeof embedded.params === 'object') {
    for (const [key, value] of Object.entries(embedded.params)) acceptParam(key, value);
  }
  const pageUrl = new URL(location.href);
  for (const [name, value] of pageUrl.searchParams) if (name.startsWith('p.')) acceptParam(name.slice(2), value);
  let coreTime = null;
  function acceptTime(raw) {
    const n = Number(raw);
    if (!Number.isFinite(n) || n <= 0) { issues.rejected++; return; }
    coreTime = Math.min(600, n); if (coreTime !== n) issues.adjusted++;
  }
  if (embedded && embedded.query && embedded.query.t != null && !pageUrl.searchParams.has('t')) acceptTime(embedded.query.t);
  if (pageUrl.searchParams.has('t')) acceptTime(pageUrl.searchParams.get('t'));
  let progress = ROLE === 'corridor' ? 0.5 : 0;
  function acceptProgress(raw) {
    const n = Number(raw);
    if (!Number.isFinite(n)) { issues.rejected++; return; }
    const value = Math.max(0, Math.min(1, n)); if (value !== n) issues.adjusted++; progress = value;
  }
  if (ROLE === 'corridor' && embedded && embedded.progress != null) acceptProgress(embedded.progress);
  if (ROLE === 'corridor' && pageUrl.searchParams.has('progress')) acceptProgress(pageUrl.searchParams.get('progress'));
  /* assets: this page runs at parts/<slug>.html (assets are ../assets/) AND lifted into any folder next to a
     copy of assets/ (assets are assets/). Try the likelier base first, fall back to the other; both are this
     page's own origin, so the lift test's "no other hosts" holds either way. ctx.assetBases carries the same
     ordered list for a module that loads its own file (sunset strip, land mask). */
  const inParts = /\/parts\/[^/]*$/.test(location.pathname);
  const ASSET_BASES = inParts ? ['../assets/', 'assets/'] : ['assets/', '../assets/'];
  const ctx = makeCtx({ demUrl: ASSET_BASES[0] + 'catalinas-dem.png' });
  ctx.assetBases = ASSET_BASES.slice();
  ctx.dem = (() => {
    let p = null;
    return () => p || (p = ASSET_BASES.reduce((acc, base) => acc.catch(() => BONEYARD.demLoader(base + 'catalinas-dem.png')()), Promise.reject(new Error('no DEM')))
      .catch((err) => { p = null; throw err; }));
  })();
  const rmq = matchMedia('(prefers-reduced-motion: reduce)');
  paramsDisclosure.open = !matchMedia('(max-width: 760px)').matches;
  const embeddedMotion = embedded && ['still', 'full'].includes(embedded.motion) ? embedded.motion : null;
  const queryMotion = ['still', 'full'].includes(pageUrl.searchParams.get('motion')) ? pageUrl.searchParams.get('motion') : null;
  if (pageUrl.searchParams.has('motion') && !queryMotion) issues.rejected++;
  let motionExplicit = !!(embeddedMotion || queryMotion);
  ctx.dial = queryMotion || embeddedMotion || (rmq.matches ? 'still' : 'full');
  html.dataset.dial = ctx.dial;
  stillBox.checked = ctx.dial === 'still';
  let handle = null, t = 0, task = null, disposed = false;
  let acc = 0, nacc = 0, liveAt = 0, W = 0, H = 0, room = null, holdTimer = 0, holdButton = null;
  const stateTimers = new Set();

  function setStatus(text, tone) { statusEl.textContent = text || ''; statusEl.dataset.tone = tone || ''; }
  function buttonState(button, state) {
    button.dataset.state = state;
    const timer = setTimeout(() => { button.removeAttribute('data-state'); stateTimers.delete(timer); }, 1000);
    stateTimers.add(timer);
  }
  function configured() {
    return Object.keys(DEFAULTS).some((key) => params[key] !== DEFAULTS[key]) ||
      (ROLE === 'corridor' && progress !== 0.5) || (motionExplicit && ctx.dial === 'still');
  }
  function updateConfigState() { configState.textContent = configured() ? 'Configured' : 'Factory'; }
  function configuredUrl(includeMotion = true) {
    const url = new URL(location.href);
    for (const key of [...url.searchParams.keys()]) if (key.startsWith('p.')) url.searchParams.delete(key);
    url.searchParams.delete('progress'); url.searchParams.delete('motion'); url.searchParams.delete('t');
    for (const key of Object.keys(DEFAULTS)) if (params[key] !== DEFAULTS[key]) url.searchParams.set('p.' + key, String(params[key]));
    if (ROLE === 'corridor' && progress !== 0.5) url.searchParams.set('progress', String(progress));
    if (coreTime !== null) url.searchParams.set('t', String(coreTime));
    if (includeMotion) url.searchParams.set('motion', ctx.dial);
    return url;
  }
  function syncAddress() {
    const url = configuredUrl(motionExplicit);
    try { history.replaceState(null, '', url.href); } catch (_) {}
    updateConfigState();
  }

  /* Pointer coordinates stay in viewport pixels for drag modules; nx/ny are relative to this stage. */
  const ptr = ctx.pointer; let tx = 0.5, ty = 0.5;
  function updatePointer(e) {
    const r = stage.getBoundingClientRect();
    tx = Math.max(0, Math.min(1, (e.clientX - r.left) / Math.max(1, r.width)));
    ty = Math.max(0, Math.min(1, (e.clientY - r.top) / Math.max(1, r.height)));
    ptr.x = e.clientX; ptr.y = e.clientY; ptr.nx = tx; ptr.ny = ty; ptr.present = true;
  }
  function setHeld(value) {
    ptr.down = !!value && ctx.dial !== 'still';
    if (holdButton) holdButton.setAttribute('aria-pressed', String(ptr.down));
  }
  function releaseInput() {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = 0; }
    setHeld(false); ctx.keys.clear();
  }
  stage.addEventListener('pointermove', updatePointer, { passive: true });
  stage.addEventListener('pointerdown', (e) => {
    if (!e.isPrimary || e.button !== 0) return;
    updatePointer(e); stage.focus({ preventScroll: true });
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    if (HOLDS && e.pointerType === 'touch') holdTimer = setTimeout(() => { holdTimer = 0; setHeld(true); }, 180);
    else setHeld(true);
  }, { passive: true });
  stage.addEventListener('pointerleave', () => { if (!ptr.down) ptr.present = false; }, { passive: true });
  addEventListener('pointerup', releaseInput, { passive: true });
  addEventListener('pointercancel', releaseInput, { passive: true });
  addEventListener('keydown', (e) => {
    if (document.activeElement !== stage || e.altKey || e.ctrlKey || e.metaKey) return;
    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (key === ' ' && HOLDS) { setHeld(true); e.preventDefault(); return; }
    if ((key === 'ArrowLeft' || key === 'ArrowRight') && handle && handle.turn) {
      if (!e.repeat) handle.turn(key === 'ArrowLeft' ? -15 : 15);
      e.preventDefault(); return;
    }
    if (key === 'ArrowLeft' || key === 'ArrowRight' || /^[a-z]$/.test(key)) {
      ctx.keys.add(key);
      if (key.startsWith('Arrow')) e.preventDefault();
    }
  });
  addEventListener('keyup', (e) => {
    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (key === ' ') setHeld(false);
    ctx.keys.delete(key);
  });
  stage.addEventListener('blur', (e) => { if (e.relatedTarget !== holdButton) releaseInput(); else ctx.keys.clear(); });
  addEventListener('blur', releaseInput);
  document.addEventListener('visibilitychange', () => { if (document.hidden) releaseInput(); });
  const readoutEl = document.getElementById('part-readout');
  /* throttled to ~7/s, TRAILING edge: a call inside the window schedules one paint for when it closes, so the
     last value always lands (a still frame that reports once right after load must not stay blank) */
  let readAt = 0, readTimer = 0, readSlug = SLUG;
  const paintReadout = () => { readTimer = 0; readAt = performance.now(); readoutEl.textContent = ctx.readouts[readSlug] || ''; };
  ctx.onReadout = (slug) => {
    readSlug = slug;
    const wait = 150 - (performance.now() - readAt);
    if (wait <= 0) { if (readTimer) { clearTimeout(readTimer); } paintReadout(); }
    else if (!readTimer) readTimer = setTimeout(paintReadout, wait);
  };

  if (navigator.connection && navigator.connection.saveData) ctx.scale = 0.75;

  function size() {
    if (disposed || !handle) return;
    const r = stage.getBoundingClientRect(); W = Math.max(1, r.width); H = Math.max(1, r.height);
    const dpr = dprCap();
    if (KIND !== 'dom') {
      const s = sizeCanvas(canvas, W, H, dpr, ctx.scale, m.pixel);
      ctx.dpr = s.dpr; handle.resize(s.w, s.h, s.dpr);
      if (ctx.dial === 'still' && handle.still) handle.still(t);
    } else {
      ctx.dpr = 1;
      if (handle.resize) handle.resize(W, H, 1);
    }
  }
  function stopTask() {
    if (task) Ticker.remove(task);
    task = null;
  }
  function destroyHandle() {
    releaseInput(); stopTask();
    if (handle) { try { handle.destroy(); } catch (err) { console.error(err); } }
    handle = null; room = null; holdButton = null;
    moduleActions.textContent = ''; host.textContent = '';
  }
  function actionButton(label, action, className) {
    const button = document.createElement('button'); button.type = 'button'; button.textContent = label;
    if (className) button.className = className;
    button.addEventListener('click', action); moduleActions.appendChild(button); return button;
  }
  function installModuleActions() {
    moduleActions.textContent = ''; holdButton = null;
    const hints = [];
    if (handle && typeof handle.turn === 'function') {
      actionButton('Turn left', () => { try { handle.turn(-15); } catch (err) { setStatus('Turn failed: ' + err.message, 'error'); } });
      actionButton('Turn right', () => { try { handle.turn(15); } catch (err) { setStatus('Turn failed: ' + err.message, 'error'); } });
      hints.push('Drag or use arrow keys');
    }
    if (handle && typeof handle.rain === 'function') {
      const button = actionButton('Rain burst', () => {
        if (handle.rain()) { buttonState(button, 'ok'); setStatus('Rain burst follows the terrain slope.'); }
        else setStatus('Terrain is not ready yet.');
      });
      hints.push('Move over the terrain or use Rain burst');
    }
    if (handle && typeof handle.launch === 'function') {
      const button = actionButton('Boost', () => {
        if (handle.launch() !== false) {
          buttonState(button, 'ok');
          setStatus(ctx.dial === 'still' ? 'Travel frame selected.' : ctx.dial === 'calm' ? 'Gentle boost engaged.' : 'Boost engaged.');
        } else setStatus('Gate is not ready yet.');
      });
      hints.push('Boost to accelerate through the light');
    }
    if (HOLDS) {
      holdButton = actionButton('Hold', (e) => {
        if (e.detail !== 0) return;
        setHeld(true);
        const timer = setTimeout(() => { setHeld(false); stateTimers.delete(timer); }, 260);
        stateTimers.add(timer);
      }, 'bay-hold');
      holdButton.setAttribute('aria-pressed', 'false'); holdButton.disabled = ctx.dial === 'still';
      holdButton.addEventListener('pointerdown', (e) => { if (e.isPrimary && e.button === 0) setHeld(true); });
      holdButton.addEventListener('pointerup', releaseInput); holdButton.addEventListener('pointercancel', releaseInput);
      holdButton.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') { setHeld(true); e.preventDefault(); }
      });
      holdButton.addEventListener('keyup', (e) => {
        if (e.key === ' ' || e.key === 'Enter') { setHeld(false); e.preventDefault(); }
      });
      holdButton.addEventListener('blur', releaseInput);
      hints.push('Hold control or Space in preview');
    }
    if (SLUG === 'switch' && room && handle && handle.play) {
      for (const dir of ['off', 'on']) {
        const button = actionButton('Switch ' + dir, async () => {
          try {
            const finished = await handle.play(room, dir, { still: ctx.dial === 'still', flash: ctx.dial === 'full', from: 0.3 });
            if (finished) { buttonState(button, 'ok'); setStatus('Switch ' + dir + ' complete.'); }
            else setStatus('Switch ' + dir + ' interrupted.');
          } catch (err) { buttonState(button, 'error'); setStatus('Switch failed: ' + err.message, 'error'); }
        });
      }
      hints.push('Play either transition');
    }
    interactionHint.textContent = hints.join(' · ') || 'Focus preview for keys';
  }
  function mountIt() {
    destroyHandle();
    if (disposed) return;
    try {
      if (KIND === 'dom') {
        host.hidden = false; canvas.hidden = true; host.style.inset = '0';
        if (SLUG === 'switch') {
          const r = document.createElement('div'); r.className = 'room-demo'; r.dataset.slug = SLUG;
          const tube = document.createElement('div'); tube.className = 'room__tube';
          const flash = document.createElement('div'); flash.className = 'room__flash';
          tube.appendChild(flash); r.appendChild(tube); host.appendChild(r);
          room = { room: r, tube, flash }; handle = m.mount(host, params, ctx);
        } else {
          handle = m.mount(host, params, ctx);
          if (handle.setDial) handle.setDial(ctx.dial);
          if (handle.start) handle.start();
        }
      } else {
        host.hidden = true; canvas.hidden = false; handle = m.mount(canvas, params, ctx);
      }
      size();
      if (KIND !== 'dom' && ctx.dial !== 'still' && handle.still) handle.still(0);
      installModuleActions(); run();
    } catch (err) {
      destroyHandle(); setStatus('Part failed to mount: ' + err.message, 'error'); console.error(err);
    }
  }
  function frame(dt) {
    if (disposed || ctx.dial === 'still' || !handle || !handle.tick || SLUG === 'switch') { task = null; return false; }
    t += dt;
    ctx.camera.v = 0.4; ctx.camera.z += 0.4 * dt;
    const k = 1 - Math.exp(-dt / 0.14);
    const base = ctx.vpBase || { x: 0.5, y: 0.38 };
    const vx = base.x + (ptr.present && !ptr.coarse ? (tx - 0.5) * 0.08 : 0);
    const vy = base.y + (ptr.present && !ptr.coarse ? (ty - 0.5) * 0.08 : 0);
    ctx.vp.x += (vx - ctx.vp.x) * k; ctx.vp.y += (vy - ctx.vp.y) * k;
    ptr.nx = tx; ptr.ny = ty;
    const t0 = performance.now();
    try { handle.tick(dt, t, ROLE === 'layer' ? ctx.camera.z : progress, ptr); }
    catch (err) { task = null; setStatus('Preview stopped: ' + err.message, 'error'); console.error(err); return false; }
    acc += performance.now() - t0; nacc++;
    if (performance.now() - liveAt > 700) {
      liveAt = performance.now();
      live.textContent = `measured now: ${(acc / Math.max(1, nacc)).toFixed(2)} ms/frame at ${Math.round(W)}x${Math.round(H)} on this machine`;
      acc = 0; nacc = 0;
    }
    return true;
  }
  function run() {
    if (task && !Ticker.has(task)) task = null;
    if (ctx.dial === 'still') {
      stopTask();
      if (handle && handle.still) handle.still(t);
      return;
    }
    if (handle && handle.tick && SLUG !== 'switch' && !task) { task = frame; Ticker.add(task); }
  }
  function applyParams(remount) {
    if (remount || !handle || !handle.params) mountIt();
    else {
      handle.params(params);
      if (ctx.dial === 'still' && handle.still) handle.still(t);
    }
    syncAddress();
  }
  function renderTweaks() {
    const n = buildTweakRow(tweaks, params, (key, value) => {
      params[key] = value; applyParams(typeof value === 'string');
    }, { defaults: DEFAULTS, rules: RULES });
    if (!n) tweaks.textContent = 'No tunables.';
    if (ROLE === 'corridor' && KIND !== 'dom') {
      const label = document.createElement('label'); label.className = 'tweak';
      const name = document.createElement('span'); name.textContent = 'progress';
      const input = document.createElement('input'); input.type = 'range'; input.name = 'progress'; input.min = '0'; input.max = '1'; input.step = '0.01'; input.value = String(progress);
      const out = document.createElement('output'); out.textContent = progress.toFixed(2);
      input.addEventListener('input', () => {
        progress = Math.max(0, Math.min(1, Number(input.value))); out.textContent = progress.toFixed(2);
        if (ctx.dial === 'still' && handle && handle.still) handle.still(t);
        syncAddress();
      });
      label.append(name, input, out); tweaks.appendChild(label);
    }
  }
  function setMotion(value, explicit) {
    releaseInput(); ctx.dial = value === 'still' ? 'still' : 'full';
    if (explicit) motionExplicit = true;
    html.dataset.dial = ctx.dial; stillBox.checked = ctx.dial === 'still';
    if (holdButton) holdButton.disabled = ctx.dial === 'still';
    if (handle && handle.setDial) handle.setDial(ctx.dial);
    if (SLUG === 'switch' && room && handle && handle.cancel && ctx.dial === 'still') handle.cancel(room);
    run();
    if (explicit) syncAddress(); else updateConfigState();
  }

  async function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return; }
    const field = document.createElement('textarea'); field.value = text; field.readOnly = true;
    field.style.cssText = 'position:fixed;left:-9999px;top:0'; document.body.appendChild(field); field.select();
    const copied = document.execCommand && document.execCommand('copy'); field.remove();
    if (!copied) throw new Error('Clipboard access is unavailable');
  }
  function downloadBlob(blob, name) {
    const url = URL.createObjectURL(blob), link = document.createElement('a');
    link.href = url; link.download = name; link.hidden = true; document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }
  function exportSource() {
    const clone = document.documentElement.cloneNode(true), cloneBody = clone.querySelector('body');
    if (cloneBody) cloneBody.classList.remove('capture');
    for (const el of clone.querySelectorAll('.part-overlay, #tweaks > *, #module-actions > *')) el.remove();
    for (const id of ['status', 'live', 'part-readout']) { const el = clone.querySelector('#' + id); if (el) { el.textContent = ''; el.removeAttribute('data-tone'); } }
    for (const button of clone.querySelectorAll('button[data-state]')) button.removeAttribute('data-state');
    for (const detail of clone.querySelectorAll('details[open]')) detail.removeAttribute('open');
    const cleanCanvas = clone.querySelector('#part');
    if (cleanCanvas) { cleanCanvas.removeAttribute('width'); cleanCanvas.removeAttribute('height'); cleanCanvas.removeAttribute('hidden'); }
    const cleanHost = clone.querySelector('#dom-host');
    if (cleanHost) { cleanHost.textContent = ''; cleanHost.hidden = true; cleanHost.removeAttribute('data-greet-host'); cleanHost.removeAttribute('data-still'); }
    const payload = { version: 1, slug: SLUG, params: Object.assign({}, params), motion: ctx.dial, query: {} };
    if (ROLE === 'corridor') payload.progress = progress;
    if (coreTime !== null) payload.query.t = coreTime;
    const json = JSON.stringify(payload).replace(/</g, '\\u003c');
    let config = clone.querySelector('#boneyard-part-config');
    if (!config) {
      config = document.createElement('script'); config.id = 'boneyard-part-config'; config.type = 'application/json';
      clone.querySelector('head').append(document.createComment(' BONEYARD_CONFIG_START '), config, document.createComment(' BONEYARD_CONFIG_END '));
    }
    config.textContent = json;
    return '<!doctype html>\n' + clone.outerHTML;
  }

  resetButton.addEventListener('click', () => {
    Object.assign(params, DEFAULTS); progress = ROLE === 'corridor' ? 0.5 : 0;
    t = 0; ctx.camera.z = 0; ctx.vp.x = ctx.vpBase.x; ctx.vp.y = ctx.vpBase.y;
    renderTweaks(); mountIt(); syncAddress(); buttonState(resetButton, 'ok'); setStatus('Parameters reset.');
  });
  copyButton.addEventListener('click', async () => {
    try { await copyText(configuredUrl(true).href); buttonState(copyButton, 'ok'); setStatus('Configured link copied.'); }
    catch (err) { buttonState(copyButton, 'error'); setStatus('Copy failed: ' + err.message, 'error'); }
  });
  pngButton.addEventListener('click', () => {
    if (KIND === 'dom' || !handle) { buttonState(pngButton, 'error'); setStatus('PNG export is unavailable for this DOM part.', 'error'); return; }
    try {
      /* A Still turn or rain burst is already drawn. Preserve that chosen frame in the PNG. */
      if (KIND === 'post' && handle.still) handle.still(t);
      canvas.toBlob((blob) => {
        if (!blob) { buttonState(pngButton, 'error'); setStatus('PNG export failed.', 'error'); return; }
        downloadBlob(blob, SLUG + '-frame.png'); buttonState(pngButton, 'ok'); setStatus('PNG download requested.');
      }, 'image/png');
    } catch (err) { buttonState(pngButton, 'error'); setStatus('PNG export failed: ' + err.message, 'error'); }
  });
  htmlButton.addEventListener('click', async () => {
    try {
      const source = exportSource(), blob = new Blob([source], { type: 'text/html;charset=utf-8' });
      if (!source.includes('id="boneyard-part-config"') || blob.size < 1024) throw new Error('Generated file was incomplete');
      downloadBlob(blob, SLUG + '-configured.html');
      buttonState(htmlButton, 'ok');
      setStatus('HTML export ready (' + Math.ceil(blob.size / 1024) + ' KB). Browser download requested.' + (needsAssets ? ' Keep assets/ beside it.' : ''));
    } catch (err) {
      if (err && err.name === 'AbortError') { setStatus('HTML save canceled.'); return; }
      buttonState(htmlButton, 'error'); setStatus('HTML export failed: ' + err.message, 'error');
    }
  });
  stillBox.addEventListener('change', () => setMotion(stillBox.checked ? 'still' : 'full', true));
  rmq.addEventListener('change', () => { if (!motionExplicit) setMotion(rmq.matches ? 'still' : 'full', false); });

  let stageObserver = null;
  if ('ResizeObserver' in window) { stageObserver = new ResizeObserver(size); stageObserver.observe(stage); }
  else addEventListener('resize', size, { passive: true });
  addEventListener('pagehide', () => {
    disposed = true; releaseInput(); destroyHandle();
    if (stageObserver) stageObserver.disconnect();
    if (readTimer) { clearTimeout(readTimer); readTimer = 0; }
    for (const timer of stateTimers) clearTimeout(timer); stateTimers.clear();
    for (const button of document.querySelectorAll('button[data-state]')) button.removeAttribute('data-state');
  });
  addEventListener('pageshow', (e) => {
    if (!e.persisted) return;
    disposed = false; if (stageObserver) stageObserver.observe(stage); mountIt();
  });

  renderTweaks(); syncAddress(); mountIt(); updateConfigState();
  if (issues.rejected || issues.adjusted) {
    const notes = [];
    if (issues.rejected) notes.push(issues.rejected + ' invalid setting' + (issues.rejected === 1 ? '' : 's') + ' ignored');
    if (issues.adjusted) notes.push(issues.adjusted + ' setting' + (issues.adjusted === 1 ? '' : 's') + ' clamped');
    setStatus(notes.join('; ') + '.');
  }
  window.BONEYARD_PART = { ctx, get handle() { return handle; }, params, stats: Ticker.stats, configuredUrl: () => configuredUrl(true).href, exportSource };
})();
</script>
</body>
</html>
