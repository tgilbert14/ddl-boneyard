*, *::before, *::after { box-sizing: border-box; }
html { background: var(--field); color: var(--ink); }
body { margin: 0; min-height: 100svh; font: 14px/1.55 var(--font-mono); }
a { color: var(--phosphor); text-underline-offset: .2em; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
.skip { position: fixed; top: 12px; left: 50%; translate: -50% -200%; z-index: 30; padding: .5rem .9rem; background: var(--field-2); color: var(--ink); border: 1px solid var(--phosphor); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; }
.skip:focus-visible { translate: -50% 0; }
#stage { position: fixed; inset: 0; z-index: 0; background: linear-gradient(180deg, var(--field-2) 0, var(--field) 38%); overflow: hidden; }
#part { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#part[data-pixel] { image-rendering: pixelated; }
#dom-host { position: absolute; left: 0; right: 0; bottom: 0; }
#dom-host[hidden] { display: none; }
.room-demo { position: absolute; inset: 12% 8% 28%; transform-origin: 50% 38%; }
.room-demo .room__tube { position: absolute; inset: 0; background: var(--field); outline: 1px solid var(--phosphor-dim); box-shadow: 0 0 18px -4px var(--phosphor-dim); transform-origin: 50% 50%; }
.room-demo .room__tube::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--phosphor) 22%, transparent), transparent 60%); }
.room-demo .room__flash { position: absolute; inset: 0; background: var(--phosphor-core); opacity: 0; }
main { position: relative; z-index: 10; min-height: 100svh; display: grid; align-content: end; padding: 60svh clamp(12px, 3vw, 28px) 2rem; pointer-events: none; }
main > * { pointer-events: auto; }
.sheet { max-width: 46rem; background: color-mix(in srgb, var(--field) 82%, transparent); border-left: 2px solid var(--phosphor); padding: 14px 16px 16px; backdrop-filter: blur(3px); }
.kicker { margin: 0 0 .4rem; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-dim); }
h1 { margin: 0; font: 600 clamp(1.3rem, 3vw, 1.9rem)/1.1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--phosphor); }
h2 { margin: 1.1rem 0 .3rem; font: 600 12px/1.2 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
.file { margin: .4rem 0 0; font-size: 12px; color: var(--ink-dim); }
.tweaks { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.tweak { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-dim); font-size: 12px; }
.tweak input[type="range"] { width: 100px; accent-color: var(--amber); }
.tweak output { min-width: 4ch; color: var(--ink); font-variant-numeric: tabular-nums; }
.tweak input[type="text"] { font: inherit; background: var(--field-2); color: var(--ink); border: 1px solid var(--line); padding: 2px 4px; }
.ctl { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-top: .6rem; font-size: 12px; color: var(--ink-dim); }
.ctl button { font: inherit; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: var(--field-2); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; cursor: pointer; }
.note p { margin: .3rem 0; max-width: 62ch; }
.prov { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 0; font-size: 12.5px; }
.prov dt { color: var(--ink-dim); text-transform: uppercase; letter-spacing: .1em; font-size: 11px; padding-top: 2px; }
.prov dd { margin: 0; }
.budget { margin: .6rem 0 0; font-size: 12px; color: var(--amber); }
#live { color: var(--ink-dim); }
nav.back { margin-top: 1rem; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; display: flex; gap: 1.2rem; flex-wrap: wrap; }
@media (prefers-reduced-motion: reduce) { .skip { transition: none; } }

<script>
(() => {
  'use strict';
  /* the harness: a mini core. Same ticker, same ctx shape, same sizing rules as the ride. */
  const { Ticker, dprCap, sizeCanvas, makeCtx, buildTweakRow } = BONEYARD;
  const SLUG = '__SLUG__', KIND = '__KIND__', ROLE = '__ROLE__';
  const m = window.BAYS.find((x) => x.slug === SLUG) || window.BAYS[window.BAYS.length - 1];
  const canvas = document.getElementById('part'), host = document.getElementById('dom-host');
  const tweaks = document.getElementById('tweaks'), ctl = document.getElementById('ctl'), live = document.getElementById('live'), stillBox = document.getElementById('still');
  /* assets: this page runs at parts/<slug>.html (assets are ../assets/) AND lifted into any folder next to a
     copy of assets/ (assets are assets/). Try the likelier base first, fall back to the other; both are this
     page's own origin, so the lift test's "no other hosts" holds either way. ctx.assetBases carries the same
     ordered list for a module that loads its own file (sunset strip, land mask). */
  const inParts = /\/parts\/[^/]*$/.test(location.pathname);
  const ASSET_BASES = inParts ? ['../assets/', 'assets/'] : ['assets/', '../assets/'];
  const ctx = makeCtx({ demUrl: ASSET_BASES[0] + 'catalinas-dem.png' });
  ctx.assetBases = ASSET_BASES.slice();
  ctx.dem = (() => {
    let p = null;
    return () => p || (p = ASSET_BASES.reduce((acc, base) => acc.catch(() => BONEYARD.demLoader(base + 'catalinas-dem.png')()), Promise.reject(new Error('no DEM')))
      .catch((err) => { p = null; throw err; }));
  })();
  const rmq = matchMedia('(prefers-reduced-motion: reduce)');
  ctx.dial = rmq.matches ? 'still' : 'full';
  stillBox.checked = ctx.dial === 'still';
  let params = Object.assign({}, m.params), handle = null, progress = ROLE === 'corridor' ? 0.5 : 0, t = 0, task = null;
  let acc = 0, nacc = 0, liveAt = 0, W = 0, H = 0, room = null;

  /* pointer: store only */
  const ptr = ctx.pointer; let tx = 0.5, ty = 0.5;
  addEventListener('pointermove', (e) => { tx = e.clientX / innerWidth; ty = e.clientY / innerHeight; ptr.x = e.clientX; ptr.y = e.clientY; ptr.present = true; }, { passive: true });
  addEventListener('pointerdown', (e) => { if (e.button !== 0 || e.target.closest('main, a, button, input')) return; ptr.down = true; }, { passive: true });
  addEventListener('pointerup', () => { ptr.down = false; }, { passive: true });
  addEventListener('pointercancel', () => { ptr.down = false; }, { passive: true });
  addEventListener('keydown', (e) => { if (e.key === ' ' && !e.target.closest('input, button, a')) { ptr.down = true; e.preventDefault(); } });
  addEventListener('keyup', (e) => { if (e.key === ' ') ptr.down = false; ctx.keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key); });
  /* the same keys the ride routes to a bay: ArrowLeft / ArrowRight and letters */
  addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey || e.target.closest('input, select, textarea')) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (k === 'ArrowLeft' || k === 'ArrowRight' || /^[a-z]$/.test(k)) ctx.keys.add(k);
  });
  addEventListener('blur', () => ctx.keys.clear());
  const readoutEl = document.getElementById('part-readout');
  /* throttled to ~7/s, TRAILING edge: a call inside the window schedules one paint for when it closes, so the
     last value always lands (a still frame that reports once right after load must not stay blank) */
  let readAt = 0, readTimer = 0, readSlug = SLUG;
  const paintReadout = () => { readTimer = 0; readAt = performance.now(); readoutEl.textContent = ctx.readouts[readSlug] || ''; };
  ctx.onReadout = (slug) => {
    readSlug = slug;
    const wait = 150 - (performance.now() - readAt);
    if (wait <= 0) { if (readTimer) { clearTimeout(readTimer); } paintReadout(); }
    else if (!readTimer) readTimer = setTimeout(paintReadout, wait);
  };

  function size() {
    W = innerWidth; H = innerHeight; const dpr = dprCap(); ctx.dpr = dpr * ctx.scale;
    if (KIND !== 'dom' && handle) { const s = sizeCanvas(canvas, W, H, dpr, ctx.scale, m.pixel); handle.resize(s.w, s.h, s.dpr); if (ctx.dial === 'still') handle.still(t); }
    else if (handle && handle.resize) handle.resize(W, H, 1);
  }
  function mountIt() {
    if (handle) { try { handle.destroy(); } catch (_) {} handle = null; }
    if (KIND === 'dom') {
      host.hidden = false; canvas.hidden = true; host.textContent = '';
      if (SLUG === 'switch') {
        const r = document.createElement('div'); r.className = 'room-demo';
        const tube = document.createElement('div'); tube.className = 'room__tube';
        const flash = document.createElement('div'); flash.className = 'room__flash';
        tube.appendChild(flash); r.appendChild(tube); host.appendChild(r);
        host.style.inset = '0';
        room = { room: r, tube, flash };
        handle = m.mount(host, params, ctx);
      } else {
        handle = m.mount(host, params, ctx);
        if (handle.start) handle.start();
        if (handle.setDial) handle.setDial(ctx.dial);
      }
    } else {
      handle = m.mount(canvas, params, ctx);
      size();
      handle.still(0);
    }
    run();
  }
  function frame(dt) {
    if (ctx.dial === 'still' || KIND === 'dom') { task = null; return false; }
    t += dt;
    /* layers get a cruising camera; bays hold; corridors take the progress slider */
    ctx.camera.v = 0.4; ctx.camera.z += 0.4 * dt;
    const k = 1 - Math.exp(-dt / 0.14);
    if (ptr.present && !ptr.coarse) { ctx.vp.x += (0.5 + (tx - 0.5) * 0.08 - ctx.vp.x) * k; ctx.vp.y += (0.38 + (ty - 0.5) * 0.08 - ctx.vp.y) * k; }
    ptr.nx = tx; ptr.ny = ty;
    const t0 = performance.now();
    handle.tick(dt, t, ROLE === 'layer' ? ctx.camera.z : progress, ptr);
    acc += performance.now() - t0; nacc++;
    if (performance.now() - liveAt > 700) { liveAt = performance.now(); live.textContent = `measured now: ${(acc / nacc).toFixed(2)} ms/frame at ${canvas.width}x${canvas.height} on this machine`; acc = 0; nacc = 0; }
  }
  function run() { if (ctx.dial === 'still') { if (handle && handle.still && KIND !== 'dom') handle.still(t); return; } if (!task) { task = frame; Ticker.add(frame); } }

  /* the tweak row: PARAMS -> inputs; a change re-tunes live where the module supports it, else remounts */
  const n = buildTweakRow(tweaks, params, (k, v) => { params[k] = v; if (handle && handle.params) { handle.params(params); if (ctx.dial === 'still' && handle.still && KIND !== 'dom') handle.still(t); } else mountIt(); });
  if (!n) tweaks.textContent = 'No tunables.';
  if (ROLE === 'corridor' && KIND !== 'dom') {
    const l = document.createElement('label'); l.className = 'tweak';
    l.innerHTML = '<span>progress</span><input type="range" min="0" max="1" step="0.01" value="0.5"><output>0.50</output>';
    l.querySelector('input').addEventListener('input', (e) => { progress = Number(e.target.value); l.querySelector('output').textContent = progress.toFixed(2); if (ctx.dial === 'still') handle.still(t); });
    tweaks.appendChild(l);
  }
  if (SLUG === 'switch') {
    for (const dir of ['off', 'on']) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Play switch ' + dir;
      b.addEventListener('click', () => { if (room) handle.play(room, dir, { still: ctx.dial === 'still', flash: ctx.dial === 'full', from: 0.3 }); });
      ctl.appendChild(b);
    }
  }
  stillBox.addEventListener('change', () => { ctx.dial = stillBox.checked ? 'still' : 'full'; if (handle && handle.setDial) handle.setDial(ctx.dial); run(); });
  rmq.addEventListener('change', () => { ctx.dial = rmq.matches ? 'still' : 'full'; stillBox.checked = rmq.matches; if (handle && handle.setDial) handle.setDial(ctx.dial); run(); });
  addEventListener('resize', size, { passive: true });
  mountIt();
  window.BONEYARD_PART = { ctx, get handle() { return handle; }, params, stats: Ticker.stats };
})();
</script>
